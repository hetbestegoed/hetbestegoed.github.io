name: Upgrade mise tools
on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  upgrade:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      - name: Open PR per upgraded tool
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BASE=$(git rev-parse --abbrev-ref HEAD)
          tools=$(awk '/^\[tools\]/{f=1;next} /^\[/{f=0} f && NF && !/^#/{sub(/ *=.*/,""); gsub(/"/,""); print}' mise.toml)
          for tool in $tools; do
            mise upgrade --bump --local "$tool"
            mise lock
            if git diff --quiet; then
              git checkout -- .
              continue
            fi
            version=$(awk -v t="$tool" -F'"' '/^\[\[tools\./{f=index($0,"[[tools." t "]]")||index($0,"[[tools.\"" t "\"]]")} f && /^version/{print $2; exit}' mise.lock)
            BRANCH="mise-upgrade-$(printf '%s' "$tool" | tr -c 'A-Za-z0-9' '-')-$(date +%Y%m%d)"
            git checkout -b "$BRANCH"
            git add mise.toml mise.lock
            git commit -m "chore(mise): upgrade $tool to $version"
            git push origin "$BRANCH"
            gh pr create \
              --title "chore(mise): upgrade $tool to $version" \
              --body "Automated upgrade of \`$tool\` to \`$version\` via \`mise upgrade --bump\`." \
              --label "dependencies" \
              --label "mise"
            git checkout "$BASE"
          done
